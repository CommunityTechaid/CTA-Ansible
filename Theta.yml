  # - name: Actually build CTAShredOS. (This'll take a while.)
  #   shell: make
  #   args:
  #     chdir: '{{ temp_dir["path"] }}/CTAShredOS'
  
  # cp files to /srv/netboot
  # mount

  ####
  #
  # HardwareOS
  #
  ####

  - name: Clone CTA Hardware OS repo
    become_user: vagrant
    git:
      repo: "git@github.com:CommunityTechaid/HardwareOS.git"
      dest: '{{ temp_dir["path"] }}/CTAHardwareOS'
      key_file: "/vagrant/ssh-keys/github_ed25519"
      accept_newhostkey: true
      version: main

  - name: Initialise config for building CTA Hardware OS
    shell: make HardwareOS_defconfig
    become_user: vagrant
    args:
      chdir: '{{ temp_dir["path"] }}/CTAHardwareOS'

  - name: Actually build CTA Hardware OS. (This'll take a while.)
    shell: make
    become_user: vagrant
    args:
      chdir: '{{ temp_dir["path"] }}/CTAHardwareOS'

  - name: Copy Hardware OS to server location
    copy:
      remote_src: true  # Src file exists remotely _to the ansible controller_
      src: '{{ temp_dir["path"] }}/CTAHardwareOS/output/images/bzImage'
      dest: /srv/netboot/HardwareOS/bzImage

